# Configuracion comun a todos los entornos.
#
# Lo que cambia entre tu maquina y produccion vive en application-local.yml y
# application-prod.yml. Aca no hay ninguna direccion, ninguna clave y ningun
# valor que dependa de donde este corriendo.
spring:
  application:
    name: lupa

  profiles:
    # Sin decir nada se trabaja en local. Render activa "prod" explicitamente.
    default: local

  jpa:
    hibernate:
      # El esquema lo maneja Flyway. Hibernate solo verifica que coincida.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # Solo health. El resto de los endpoints de actuator cuentan cosas de la
        # aplicacion que no tienen por que ser publicas.
        include: health
  endpoint:
    health:
      # Sin detalle: si la base esta caida se responde 503, pero sin explicar
      # que motor es ni que version corre.
      show-details: never

logging:
  level:
    org.springframework.security: INFO
